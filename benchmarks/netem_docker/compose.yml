# Two machines on a private network: the MCP server and a client. Each shapes its own egress with tc netem (see entrypoint.sh).
# The server's descriptors point at localhost:8000, so the client forwards its own localhost:8000 to the server over the
# shaped link with socat.
services:
  server:
    image: transform-netem
    cap_add: [NET_ADMIN]
    environment:
      NETEM_DELAY_MS: ${NETEM_DELAY_MS:-}
      NETEM_RATE_MBIT: ${NETEM_RATE_MBIT:-}
      NETEM_LOSS_PCT: ${NETEM_LOSS_PCT:-}
      TRANSFORM_SCRATCH_DIR: /scratch
      FORMAT_LATENCY_NETWORK_MBPS: ${NETEM_RATE_MBIT:-0}
      FORMAT_COST_AWARE: ${FORMAT_COST_AWARE:-}
      FORMAT_INLINE_MAX_BYTES: ${FORMAT_INLINE_MAX_BYTES:-}
      PARQUET_ENCODING_STRATEGY: data_driven
    working_dir: /scratch
    tmpfs: [/scratch]
    command: ["/opt/server/bin/uvicorn", "server_app:app", "--app-dir", "/app/python-server", "--host", "0.0.0.0",
              "--port", "8000", "--timeout-keep-alive", "600"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 2s
      retries: 30
  client:
    image: transform-netem
    cap_add: [NET_ADMIN]
    depends_on:
      server: {condition: service_healthy}
    environment:
      NETEM_DELAY_MS: ${NETEM_DELAY_MS:-}
      NETEM_RATE_MBIT: ${NETEM_RATE_MBIT:-}
      NETEM_LOSS_PCT: ${NETEM_LOSS_PCT:-}
      PROFILE: ${PROFILE:-unshaped}
      QUICK_ARGS: ${QUICK_ARGS:-}
      PYTHONPATH: /app
    volumes:
      - ../../results/netem_docker:/out
    command: ["sh", "-c", "socat TCP-LISTEN:8000,bind=127.0.0.1,fork,reuseaddr TCP:server:8000 & sleep 1 && exec /opt/client/bin/python -m benchmarks.netem_docker.quick --out /out/$$PROFILE.csv $$QUICK_ARGS"]
